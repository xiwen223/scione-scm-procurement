function productCell(item){if(item.type==='merged'){let count=(item.skuItems||[]).length;return `<span class="sku-summary">共 <b>${count}</b> 个商品/SKU</span>`}return `<div class="primary">${esc(item.name)}</div><div class="secondary">${esc(item.sku)}</div>`}
function itemRow(item){let merged=item.type==='merged'?mergedTotals(item):null,quantity=item.type==='kit'?`${item.support} / ${item.target}`:item.type==='merged'?`${merged.qualified} / ${merged.expected}`:`${item.qualified} / ${item.expected}`,typeLabel={single:'单品',kit:'套装',merged:'合并下单'}[item.type]||item.type,childRow=item.type==='kit'?componentRow(item):item.type==='merged'?mergedRow(item):'',expandLabel=item.type==='merged'?'SKU明细':'套装组件';return `<tr class="main-row"><td>${riskTag(item.risk)}</td><td><div class="po-cell">${item.type==='kit'||item.type==='merged'?`<button class="expand" data-expand="${item.id}" title="展开${expandLabel}" aria-label="展开${expandLabel}" aria-expanded="false" aria-controls="components-${item.id}">›</button>`:''}<div><div>${poSummary(item.po)}</div><div>${planSummary(item)}</div></div></div></td><td>${typeLabel}</td><td>${productCell(item)}</td><td>${esc(item.supplier)}</td><td>${esc(item.buyer)}</td><td>${esc(item.warehouse)}</td><td><div class="progress-meta"><span>${quantity}</span></div></td><td><div>${item.created}</div><div class="secondary">已历经 ${item.days} 天</div></td><td><button class="detail-btn" data-detail="${item.id}">查看详情</button></td></tr>${childRow}`}
function componentRow(item){return `<tr class="component-row" id="components-${item.id}"><td colspan="10"><div class="component-box"><div class="component-title">套装完整组件 · 筛选命中任一组件时仍保留全部上下文</div><table class="component-table"><thead><tr><th>组件商品 / SKU</th><th>风险</th><th>采购单 / 计划</th><th>供应商</th><th>数量进度</th><th>操作</th></tr></thead><tbody>${item.components.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="secondary">${esc(c.sku)}</div></td><td>${riskTag(c.risk)}</td><td>${poLinks([c.po])}<div class="secondary">${poLinks(c.plans)}</div></td><td>${esc(c.supplier)}</td><td>${c.qualified} / ${c.expected}</td><td><button class="detail-btn" data-detail="${item.id}" data-component="${c.id}">明细详情</button></td></tr>`).join('')}</tbody></table></div></td></tr>`}
function mergedRow(item){return `<tr class="component-row" id="components-${item.id}"><td colspan="10"><div class="component-box"><div class="component-title">合并下单 SKU 明细 · 数量进度为每个 SKU 的合格入库数量 / 应交数量</div><table class="component-table"><thead><tr><th>商品 / SKU</th><th>风险</th><th>采购单 / 计划</th><th>供应商</th><th>数量进度</th><th>操作</th></tr></thead><tbody>${item.skuItems.map(sku=>`<tr><td><b>${esc(sku.name)}</b><div class="secondary">${esc(sku.sku)}</div></td><td>${riskTag(sku.risk)}</td><td>${poLinks([sku.po])}<div class="secondary">${poLinks(sku.plans)}</div></td><td>${esc(sku.supplier)}</td><td>${sku.qualified} / ${sku.expected}</td><td><button class="detail-btn" data-detail="${item.id}" data-component="${sku.id}">明细详情</button></td></tr>`).join('')}</tbody></table></div></td></tr>`}
function renderChips(){let labels={risk:'风险',supplier:'供应商',buyer:'采购员',warehouse:'仓库',type:'商品类型'},typeMap={single:'单品',kit:'套装',merged:'合并下单'},arr=[];if(state.keyword)arr.push(['keyword','关键词',state.keyword]);['risk','supplier','buyer','warehouse','type'].forEach(k=>{if(state[k])arr.push([k,labels[k],k==='risk'?riskMeta[state[k]].label:k==='type'?typeMap[state[k]]:state[k]])});$('chips').innerHTML=arr.length?arr.map(x=>`<span class="chip">${x[1]}：${esc(x[2])}<button data-clear="${x[0]}">×</button></span>`).join(''):'';$('chips').parentElement.style.display=arr.length?'flex':'none'}
function renderTable(){closePlanPopover();let list=filtered(),pages=Math.max(1,Math.ceil(list.length/state.pageSize));if(state.page>pages)state.page=pages;let slice=list.slice((state.page-1)*state.pageSize,state.page*state.pageSize);$('tableBody').innerHTML=slice.length?slice.map(itemRow).join(''):`<tr><td colspan="10"><div class="empty">未找到符合条件的采购交付事项，请调整筛选条件</div></td></tr>`;$('viewTitle').textContent={all:'全部采购交付事项',dueSoon:'即将超期事项',overdue:'超期事项',manual:'人工判断事项',kit:'套装交付事项'}[state.view];$('pagination').innerHTML=`<span class="section-note">共 ${list.length} 条</span><button class="page-btn" data-page="${state.page-1}" ${state.page===1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="page-btn ${state.page===i+1?'active':''}" data-page="${i+1}">${i+1}</button>`).join('')}<button class="page-btn" data-page="${state.page+1}" ${state.page===pages?'disabled':''}>›</button>`;renderChips()}
function render(){renderQuick();renderTable()}
function showToast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function timeline(events){return `<div class="timeline">${events.map(e=>`<div class="event"><time>${e[0]}</time><strong>${e[1]}</strong><p>${e[2]}</p></div>`).join('')}</div>`}
function openDrawer(itemId,componentId){let item=data.find(x=>x.id===itemId),d=componentId?allDetails(item).find(x=>x.id===componentId):item,isMergedSku=componentId&&item.type==='merged';$('drawerTitle').textContent=componentId?`${d.name} · ${isMergedSku?'SKU明细':'组件明细'}`:item.name;$('drawerSub').textContent='';$('drawerBody').innerHTML=`<div class="detail-section" style="margin-top:0"><h3>${componentId?(isMergedSku?'合并下单采购事实事件':'套装采购事实事件'):'采购事实事件'}</h3>${timeline(item.events||[])}</div>`;$('mask').classList.add('show');$('drawer').classList.add('show');document.body.style.overflow='hidden'}
function closeDrawer(){$('mask').classList.remove('show');$('drawer').classList.remove('show');document.body.style.overflow=''}
const planPopover=$('planPopover'),planPopoverTitle=$('planPopoverTitle'),planPopoverList=$('planPopoverList');let activePlanTrigger=null;
function closePlanPopover(){if(activePlanTrigger)activePlanTrigger.setAttribute('aria-expanded','false');activePlanTrigger=null;planPopover.hidden=true}
function openPlanPopover(trigger){let item=data.find(x=>x.id===trigger.dataset.planView),plans=item?.plans||[];if(plans.length<2)return;closePlanPopover();activePlanTrigger=trigger;trigger.setAttribute('aria-expanded','true');planPopoverTitle.textContent=`关联采购计划（${plans.length}）`;planPopoverList.innerHTML=plans.map((plan,index)=>`<div class="plan-popover-item"><span class="plan-popover-index">${index+1}</span><span class="external" data-link="${esc(plan)}">${esc(plan)}</span></div>`).join('');planPopover.hidden=false;let rect=trigger.getBoundingClientRect(),width=planPopover.offsetWidth,height=planPopover.offsetHeight,left=Math.max(8,Math.min(rect.right-width,window.innerWidth-width-8)),top=rect.bottom+5;if(top+height>window.innerHeight-8)top=Math.max(8,rect.top-height-5);planPopover.style.left=`${left}px`;planPopover.style.top=`${top}px`}
$('planPopoverClose').onclick=closePlanPopover;planPopover.addEventListener('click',e=>{let link=e.target.closest('[data-link]');if(link){showToast(`原型演示：将跳转领星单据 ${link.dataset.link}`);closePlanPopover()}});document.addEventListener('click',e=>{if(!e.target.closest('[data-plan-view]')&&!e.target.closest('#planPopover'))closePlanPopover()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlanPopover()});window.addEventListener('resize',closePlanPopover);document.querySelector('.table-wrap').addEventListener('scroll',closePlanPopover);
fillSelect('supplierFilter',unique('supplier'));fillSelect('buyerFilter',unique('buyer'));fillSelect('warehouseFilter',unique('warehouse'));render();
$('quickGrid').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;state.page=1;render()});
['risk','supplier','buyer','warehouse','type'].forEach(k=>{$(k+'Filter').addEventListener('change',e=>{state[k]=e.target.value;state.page=1;render()})});
function applySearch(){state.keyword=$('keyword').value.trim();state.page=1;render()}$('searchBtn').onclick=applySearch;$('keyword').addEventListener('keydown',e=>{if(e.key==='Enter')applySearch()});
$('resetBtn').onclick=()=>{state={view:'all',keyword:'',risk:'',supplier:'',buyer:'',warehouse:'',type:'',page:1,pageSize:6};$('keyword').value='';['risk','supplier','buyer','warehouse','type'].forEach(k=>$(k+'Filter').value='');render();showToast('已重置全部筛选条件')};
$('chips').addEventListener('click',e=>{let b=e.target.closest('[data-clear]');if(!b)return;let k=b.dataset.clear;state[k]='';if(k==='keyword')$('keyword').value='';else $(k+'Filter').value='';state.page=1;render()});
$('tableBody').addEventListener('click',e=>{let planView=e.target.closest('[data-plan-view]');if(planView){openPlanPopover(planView);return}let ex=e.target.closest('[data-expand]');if(ex){let row=$('components-'+ex.dataset.expand),open=!ex.classList.contains('open'),item=data.find(x=>x.id===ex.dataset.expand),isMerged=item?.type==='merged',label=open?(isMerged?'收起SKU明细':'收起套装组件'):(isMerged?'展开SKU明细':'展开套装组件');ex.classList.toggle('open',open);row.classList.toggle('show',open);ex.setAttribute('aria-expanded',String(open));ex.setAttribute('aria-label',label);ex.title=label;return}let det=e.target.closest('[data-detail]');if(det){openDrawer(det.dataset.detail,det.dataset.component);return}let l=e.target.closest('[data-link]');if(l){showToast(`原型演示：将跳转领星单据 ${l.dataset.link}`)}});
$('drawerBody').addEventListener('click',e=>{let l=e.target.closest('[data-link]');if(l)showToast(`原型演示：将跳转领星单据 ${l.dataset.link}`)});
$('pagination').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b||b.disabled)return;state.page=Number(b.dataset.page);renderTable();document.querySelector('.workspace').scrollIntoView({behavior:'smooth'})});
$('closeDrawer').onclick=closeDrawer;$('mask').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
</script>
</body>
</html>
